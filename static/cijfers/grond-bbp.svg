<title id="t">Waarde van alle grond in Nederland, in % van het bbp</title>
<desc id="d">Lijngrafiek van de waarde van alle grond in Nederland als percentage van het bbp, 1995 tot 2025. Van 74% in 1995 naar 184% in 2007, terug naar 132% in 2013 en daarna omhoog naar 233% in 2025. Ter vergelijking: volgens schattingen van Lars Doucet ongeveer 200% in de VS en meer dan 500% in Zuid-Korea.</desc>
