<text x="34.0" y="339.5" font-size="12" fill="#6b685f" text-anchor="end" style="font-variant-numeric:tabular-nums">100%</text>
<line x1="40.0" y1="282.5" x2="268.0" y2="282.5" stroke="#e0ddd6" stroke-width="1"/>
<text x="34.0" y="286.7" font-size="12" fill="#6b685f" text-anchor="end" style="font-variant-numeric:tabular-nums">200%</text>
<line x1="40.0" y1="229.8" x2="268.0" y2="229.8" stroke="#e0ddd6" stroke-width="1"/>
<text x="34.0" y="234.0" font-size="12" fill="#6b685f" text-anchor="end" style="font-variant-numeric:tabular-nums">300%</text>
<line x1="40.0" y1="177.1" x2="268.0" y2="177.1" stroke="#e0ddd6" stroke-width="1"/>
<text x="34.0" y="181.3" font-size="12" fill="#6b685f" text-anchor="end" style="font-variant-numeric:tabular-nums">400%</text>
