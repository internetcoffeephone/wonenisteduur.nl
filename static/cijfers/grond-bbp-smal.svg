<text x="0.0" y="24.8" font-size="16" fill="#2c3e50" font-weight="600">Waarde van alle grond in Nederland,</text>
<text x="0.0" y="45.6" font-size="16" fill="#2c3e50" font-weight="600">in procenten van het bbp</text>
<text x="0.0" y="63.8" font-size="13" fill="#5c5a54">Grond onder woningen en bedrijven en</text>
<text x="0.0" y="82.0" font-size="13" fill="#5c5a54">landbouwgrond, eind van elk jaar</text>
<line x1="40.0" y1="388.0" x2="268.0" y2="388.0" stroke="#b9b4a9" stroke-width="1"/>
