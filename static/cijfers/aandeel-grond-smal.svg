<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 502" width="380" height="502" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Aandeel van de grond in de woningwaarde</title>
<desc id="d">Lijngrafiek van het aandeel van de grond in de waarde van alle woningen, 1995 tot 2022. Van 23% in 1995 naar 52% in 2008, 42% in 2013 en 62% in 2022. Een berekening van DNB voor 2018, 55%, ligt op de lijn.</desc>
<rect width="380" height="502" fill="#fafaf8"/>
<text x="0.0" y="24.8" font-size="16" fill="#2c3e50" font-weight="600">Welk deel van de woningwaarde is</text>
<text x="0.0" y="45.6" font-size="16" fill="#2c3e50" font-weight="600">grond?</text>
<text x="0.0" y="63.8" font-size="13" fill="#5c5a54">Grond onder woningen als percentage van de</text>
<text x="0.0" y="82.0" font-size="13" fill="#5c5a54">waarde van grond en woningen samen</text>
<line x1="0.0" y1="97.6" x2="18.0" y2="97.6" stroke="#5f8a3f" stroke-width="2.5"/>
<text x="24.0" y="102.0" font-size="12.5" fill="#2c2c2c">CBS</text>
<path d="M73.5,92.6L78.5,97.6L73.5,102.6L68.5,97.6Z" fill="#fafaf8" stroke="#2c2c2c" stroke-width="2"/>
<text x="88.5" y="102.0" font-size="12.5" fill="#2c2c2c">DNB-berekening voor 2018 (ESB, 2019)</text>
