<text x="34.0" y="353.7" font-size="12" fill="#6b685f" text-anchor="end" style="font-variant-numeric:tabular-nums">25%</text>
<line x1="40.0" y1="277.0" x2="306.0" y2="277.0" stroke="#e0ddd6" stroke-width="1"/>
<text x="34.0" y="281.2" font-size="12" fill="#6b685f" text-anchor="end" style="font-variant-numeric:tabular-nums">50%</text>
