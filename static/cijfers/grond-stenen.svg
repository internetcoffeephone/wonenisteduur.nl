<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 692 441" width="692" height="441" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Grond onder woningen en de woningen zelf</title>
<desc id="d">Lijngrafiek van de waarde van de grond onder alle Nederlandse woningen en van de woningen zelf, in miljard euro, 1995 tot 2022. De stenen stijgen geleidelijk van €408 naar €1.232 miljard. De grond stijgt van €121 naar €2.045 miljard, met een dip tussen 2008 en 2013. Sinds 2000 is de grond meer waard dan de stenen.</desc>
