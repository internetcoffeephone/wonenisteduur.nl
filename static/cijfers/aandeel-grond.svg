<text x="0.0" y="26.1" font-size="17" fill="#2c3e50" font-weight="600">Welk deel van de woningwaarde is grond?</text>
<text x="0.0" y="45.0" font-size="13.5" fill="#5c5a54">Grond onder woningen als percentage van de waarde van grond en woningen samen</text>
