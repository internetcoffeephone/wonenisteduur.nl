baseURL = "https://wonenisteduur.nl/"
languageCode = "nl"
defaultContentLanguage = "nl"
title = "Wonen is te duur"

disableKinds = ["taxonomy", "term", "RSS", "sitemap", "robotsTXT", "404"]

[markup.goldmark.renderer]
unsafe = true

[params]
description = "Wonen in Nederland is onbetaalbaar. De grondwaardebelasting is de oplossing."
ogImage = ""
# GoatCounter site code (https://<code>.goatcounter.com). Empty disables analytics.
goatcounter = "wonenisteduur"
# Contact address, split so it is assembled client-side (see layouts/partials/email.html).
contactUser = "hugo"
contactDomain = "wonenisteduur.nl"

[caches]
  [caches.images]
    dir = ':cacheDir/images'
