  - id: rapporten
    titel: Rapporten
    items:
      - titel: DNB — de grondslag van een planbatenheffing
        datum: 2025-06-02
        status: rapport
        tekst: >-
          Schat de waardestijging door het omzetten van landbouwgrond in woningbouwgrond op zo'n
          €1,4 miljoen per hectare en de landelijke planbaten op €7 à 8 miljard per jaar. De auteurs
          noemen de schatting indicatief en waarschuwen dat eigenaren zonder rendement minder snel
          bouwgrond aanbieden.
        bronnen:
          - titel: De Meijier & Hebbink, DNB Analyse
            url: https://www.dnb.nl/publicaties/publicaties-onderzoek/analyse/grondslag-van-een-planbatenheffing/
      - titel: IBO "Op grond kun je bouwen"
        datum: 2024-06
        status: rapport
        tekst: >-
          Een algemene grondbelasting is efficiënt, maar complex, vraagt een lang overgangspad en is
          "niet doelmatig als alleen woningbouw het doel is". Een belasting op bouwgrond waar nog niet
          gebouwd wordt, noemt het rapport een "doelmatig alternatief". Het splitsen van de WOZ in een
          grond- en een opstaldeel maakt verschillende OZB-tarieven mogelijk. Naar schatting een kwart
          van de harde plancapaciteit blijft lang ongebruikt.
        bronnen:
          - titel: IBO woningbouw en grond (2024), p. 47–48
            url: https://zoek.officielebekendmakingen.nl/blg-1149537.pdf
      - titel: COELO en ESBL voor het ministerie van Financiën
        datum: 2024-05-31
        status: rapport
        tekst: >-
          Een algemene grondbelasting "kan binnen de bestaande ozb worden ingepast en is een zeer
          efficiënte manier om belastinggeld te verkrijgen", maar is "minder geschikt om woningbouw te
          versnellen". Een belasting op alleen bebouwbare grond zal volgens de onderzoekers maar een
          beperkt effect op de woningbouw hebben. Een planbatenheffing kan wél een goede bijdrage
          leveren.
        bronnen:
          - titel: Allers, Schep e.a., "Mogelijkheden voor invoering van een planbatenheffing en een grondbelasting"
            url: https://www.coelo.nl/images/rapporten/Eindrapport_planbatenheffing_en_grondbelasting_3_juni_2024.pdf
      - titel: Werkgroep "Bouwstenen voor een beter belastingstelsel" (BZK)
        datum: 2020-05-01
        status: rapport
        tekst: >-
          Beoordeelde een grondbelasting als "minder kansrijk": hoog scorend op opbrengst en
          economische efficiëntie, maar met de laagste score op uitvoerbaarheid. De Waarderingskamer
          was "overwegend kritisch": Amsterdams onderzoek naar erfpacht vond weinig doorwerking in
          prijzen, een grondbelasting zou betaalbare bouw op centrumlocaties kunnen belemmeren, de
          grondmarkt is in Nederland grotendeels in handen van overheden, en het splitsen van de WOZ in
          grond en opstal verhoogt de uitvoeringskosten en het aantal bezwaren.
        bronnen:
          - titel: Bouwstenen voor een beter belastingstelsel, bijlage 4.5 en 4.10
            url: https://zoek.officielebekendmakingen.nl/blg-933312.pdf

  - id: provincies
    titel: Provincies
    items:
      - titel: Zuid-Holland — lobby voor een planbatenheffing (moties 1681 en 1780)
        datum: 2026-02-24
        status: aangenomen
        tekst: >-
          Provinciale Staten namen op 9 juli 2025 motie 1681 "Aan de slag met planbatenheffing" aan en
          op 12 november 2025, na staking van stemmen in oktober, motie 1780 "Lobby voor invoering
          planbatenheffing". Gedeputeerde Staten vroegen de minister van VRO op 24 februari 2026 per brief
          om een planbatenheffing, en niet alleen om meer kostenverhaal.
        bronnen:
          - titel: GS-voorstel motie 1780 (24 februari 2026)
            url: https://www.zuid-holland.nl/publish/besluitenattachments/behandelvoorstel-motie-1780-lobby-voor-invoering-planbatenheffing-oproep-bespoed/gs-voorstel-behandelvoorstel-motie-1780-lobby-voor-invoering-planbatenheffing-op.pdf
          - titel: GS-voorstel motie 1681
            url: https://www.zuid-holland.nl/publish/besluitenattachments/behandelvoorstel-motie-1681-aan-de-slag-met-planbatenheffing/gs-voorstel-behandelvoorstel-motie-1681-aan-de-slag-met-planbatenheffing-dos-201.pdf

  - id: gemeenten
    titel: Gemeenten
    items:
      - titel: Amsterdam — onderzoek naar een boete op uitgestelde bouwprojecten
        datum: 2026-06
        status: plan
        tekst: >-
          Het coalitieakkoord 2026–2030 van PRO en D66: "We onderzoeken of er een boete kan komen op
          het zonder goede reden uitstellen van bouwprojecten." De stad wil ook vaker het voorkeursrecht
          gebruiken. De OZB gaat deze periode niet omhoog, behalve met de inflatie.
        bronnen:
          - titel: NH Nieuws (3 juni 2026) over het coalitieakkoord
            url: https://www.nhnieuws.nl/nieuws/360373/wat-staat-in-coalitieakkoord-amsterdam
      - titel: Utrecht — OZB fors omhoog
        datum: 2026
        status: plan
        tekst: >-
          Het coalitieakkoord 2026–2030 verhoogt de OZB voor woningen met 15% en voor niet-woningen met
          23%, goed voor €41,5 miljoen per jaar vanaf 2027. Gemeenten verhogen de OZB dus al; de vraag
          is of ze die mogen verschuiven van gebouwen naar grond.
        bronnen:
          - titel: Coalitieakkoord gemeente Utrecht 2026–2030
            url: https://www.utrecht.nl/fileadmin/uploads/documenten/bestuur-en-organisatie/college-van-b-en-w/collegeformatie/16927_GU_Coalitieakkoord_2026-2030_Digitaal.pdf

