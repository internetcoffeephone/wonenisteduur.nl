# Nederlandse stand van zaken (sectie "En in Nederland?" op /wereldwijd/).
#
# Per item: titel, datum (JJJJ-MM-DD of JJJJ-MM), status, tekst (Markdown mag),
# optioneel voor/tegen (fracties bij stemmingen) en bronnen (titel + url).
# Statussen: programma, akkoord, aangenomen, verworpen, aangehouden, in-werking, rapport, brief, plan
# Stemmingsuitslagen komen uit de open data van de Tweede Kamer (gegevensmagazijn.tweedekamer.nl).
# Fractienamen staan zoals op het moment van stemmen (GroenLinks-PvdA heet sinds juni 2026 PRO).

bijgewerkt: 2026-10-21

categorieen:
  - id: wet
    titel: Wat de wet nu toestaat
    items:
      - titel: "OZB: één tarief over grond en gebouw samen"
        datum: 2026-10
        datum_tekst: Geldende wet, oktober 2026
        status: in-werking
        tekst: >-
          De OZB wordt geheven over de WOZ-waarde van grond en gebouw samen (art. 220c Gemeentewet),
          met één percentage per categorie (art. 220f). Gemeenten mogen alleen de belastingen heffen
          die de wet noemt (art. 219). Een gemeente kan dus niet zelf de grond zwaarder belasten dan
          het gebouw; daarvoor moet de wet veranderen.
        bronnen:
          - titel: Gemeentewet, art. 220f
            url: https://wetten.overheid.nl/jci1.3:c:BWBR0005416&artikel=220f
      - titel: "Leegstandbelasting (art. 221a Gemeentewet): het voorbeeld van een opt-in"
        datum: 2026-03-21
        status: in-werking
        tekst: >-
          Gemeenten mógen sinds 21 maart 2026 een belasting heffen op woningen die langer dan twaalf
          maanden leegstaan; ze bepalen zelf de maatstaf. Het artikel kwam er via een amendement van
          Stultiens c.s. op de Fiscale verzamelwet 2026, dat de Tweede Kamer op 23 september 2025
          aannam (stemming hieronder; de ChristenUnie liet achteraf weten vóór te hebben willen
          stemmen). Een opt-in voor een grondbelasting zou op dezelfde manier kunnen worden geregeld.
        voor: [SP, GroenLinks-PvdA, PvdD, DENK, Volt, D66, NSC, PVV]
        tegen: [ChristenUnie, SGP, CDA, VVD, JA21, BBB]
        bronnen:
          - titel: Gemeentewet, art. 221a
            url: https://wetten.overheid.nl/jci1.3:c:BWBR0005416&artikel=221a
          - titel: Staatsblad 2025, 431
            url: https://zoek.officielebekendmakingen.nl/stb-2025-431.html
          - titel: Staatsblad 2026, 58 (inwerkingtreding)
            url: https://zoek.officielebekendmakingen.nl/stb-2026-58.html

  - id: partijen
    titel: Partijen (verkiezingen van 29 oktober 2025)
    intro: >-
      Volgens de doorrekening door het CPB (Keuzes in Kaart 2027–2030, oktober 2025). Alleen tien
      partijen deden mee; PVV, SP, PvdD, FVD en DENK niet.
    items:
      - titel: GroenLinks-PvdA (nu PRO)
        datum: 2025-10
        status: programma
        tekst: >-
          Een grondwaardebelasting op percelen met een waarde vanaf €1 miljoen: €1,0 miljard per jaar,
          betaald door bedrijven. Het CPB waarschuwt dat daarvoor een nieuwe registratie van
          grondwaarden nodig is en dat het mogelijk tot uitvoeringsproblemen bij de Belastingdienst
          leidt. Daarnaast een gemeentelijke planbatenheffing (structureel €1,5 miljard in 2037).
        bronnen:
          - titel: CPB, Keuzes in Kaart 2027–2030 (pdf, p. 178–179)
            url: https://omgevingsweb.nl/wp-content/uploads/2025/10/1083646.pdf
      - titel: D66
        datum: 2025-10
        status: programma
        tekst: >-
          Een landelijke heffing voor bedrijven op de waarde van grond waarop geen woningen staan:
          €1,0 miljard. Een planbatenheffing van €1,3 miljard; volgens het CPB geeft snelle invoering
          juridische en uitvoeringsrisico's. Ook het schrappen van OZB-vrijstellingen voor
          niet-woningen (€1,2 miljard).
        bronnen:
          - titel: CPB, Keuzes in Kaart 2027–2030 (p. 222)
            url: https://omgevingsweb.nl/wp-content/uploads/2025/10/1083646.pdf
      - titel: Volt
        datum: 2025-10
        status: programma
        tekst: >-
          Een grondwaardebelasting op percelen met een waarde vanaf €1 miljoen (€1,0 miljard, betaald
          door bedrijven) en een planbatenheffing (€0,2 miljard in 2037).
        bronnen:
          - titel: CPB, Keuzes in Kaart 2027–2030 (p. 290–291)
            url: https://omgevingsweb.nl/wp-content/uploads/2025/10/1083646.pdf
      - titel: CDA en ChristenUnie
        datum: 2025-10
        status: programma
        tekst: >-
          Geen grondbelasting, wel een gemeentelijke planbatenheffing: CDA €0,2 miljard in 2037 (de
          opbrengst gaat naar gemeenten voor woningbouw), ChristenUnie €1,0 miljard in 2037.
        bronnen:
          - titel: CPB, Keuzes in Kaart 2027–2030 (p. 238, 244 en 272)
            url: https://omgevingsweb.nl/wp-content/uploads/2025/10/1083646.pdf
      - titel: VVD, NSC, BBB, SGP en JA21
        datum: 2025-10
        status: programma
        tekst: >-
          In hun doorrekening komt geen grondbelasting of planbatenheffing voor.
        bronnen:
          - titel: CPB, Keuzes in Kaart 2027–2030
            url: https://omgevingsweb.nl/wp-content/uploads/2025/10/1083646.pdf

  - id: kabinet
    titel: Kabinet
    items:
      - titel: Coalitieakkoord D66, VVD en CDA (kabinet-Jetten)
        datum: 2026-01-30
        status: akkoord
        tekst: >-
          "De fiscale behandeling van de eigen woning [blijft] ongewijzigd." Gemeenten krijgen meer
          mogelijkheden voor actief grondbeleid (voorkeursrecht, een grondfaciliteit). Voor het
          afromen van winst op grond is "uitbreiden van het kostenverhaal het snelst en meest
          geschikt". Vóór eind 2026 komt een hervormingsagenda voor het belastingstelsel, te beginnen
          met de inkomstenbelasting. Een grondbelasting staat er niet in.
        bronnen:
          - titel: Coalitieakkoord "Aan de slag", p. 19 en 66
            url: https://zoek.officielebekendmakingen.nl/blg-1233855.pdf
      - titel: "Kamerbrief: liever meer kostenverhaal dan een planbatenheffing"
        datum: 2025-06-20
        status: brief
        tekst: >-
          De minister van VRO geeft de voorkeur aan uitbreiding van het bestaande kostenverhaal
          boven een nieuwe planbatenheffing, "met name omdat er geen extra instrument wordt
          geïntroduceerd". Omdat zo'n 70% van de woningbouw binnenstedelijk is, ontstaat daar
          weinig waardestijging door bestemmingswijziging; een planbatenheffing werkt vooral buiten
          de stad.
        bronnen:
          - titel: Kamerstuk 32847, nr. 1351
            url: https://zoek.officielebekendmakingen.nl/kst-32847-1351.html

