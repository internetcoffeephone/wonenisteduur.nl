      - titel: Grinwis c.s. — inbrengwaarde van grond op de residuele waarde
        datum: 2026-09-29
        status: aangenomen
        tekst: >-
          Verzoekt de regering de waarde van grond bij kostenverhaal vanaf 2028, uiterlijk 2029, te
          bepalen met de residuele methode (opbrengst van de ontwikkeling min de kosten). De motie
          noemt een planbatenheffing "complex", met risico op vertraging, en kiest daarom voor
          kostenverhaal. Een grondadviseur noemde de methode op Omgevingsweb "nodeloos ingewikkeld"
          en onuitvoerbaar.
        voor: [SGP, BBB, CDA, Groep Markuszower, D66, JA21, FVD, VVD, Keijzer, 50PLUS, Volt, ChristenUnie, PVV]
        tegen: [PRO, SP, DENK, PvdD]
